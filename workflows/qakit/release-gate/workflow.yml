id: release-gate
name: Release Gate Workflow
version: 1.0.0
description: Evaluate release readiness from coverage, defects, and traceability.
tags: [release, gate]
steps:
  - id: coverage
    type: command
    command: qakit.coverage
  - id: traceability
    type: command
    command: qakit.traceability
  - id: regression
    type: command
    command: qakit.regression
  - id: defects
    type: command
    command: qakit.defects
  - id: release-gate
    type: command
    command: qakit.release-gate
