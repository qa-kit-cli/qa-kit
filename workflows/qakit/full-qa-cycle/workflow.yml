id: full-qa-cycle
name: Full QA Cycle
version: 1.0.0
description: Complete QA lifecycle from policy through strategy, planning, test writing, and CI setup.
tags: [lifecycle, full]
steps:
  - id: policy
    type: command
    command: qakit.policy
  - id: strategy
    type: command
    command: qakit.strategy
  - id: testplan
    type: command
    command: qakit.testplan
  - id: tasks
    type: command
    command: qakit.tasks
  - id: write-playwright
    type: command
    command: qakit.write.playwright
  - id: ci
    type: command
    command: qakit.ci.github-actions
