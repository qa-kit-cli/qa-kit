id: full-qa-cycle
name: Full QA Cycle
version: 1.0.0
description: Complete QA lifecycle from policy through coverage and CI review.
tags: [lifecycle, full]
steps:
  - id: policy
    type: command
    command: qakit.policy
  - id: strategy
    type: command
    command: qakit.strategy
  - id: clarify
    type: command
    command: qakit.clarify
  - id: testplan
    type: command
    command: qakit.testplan
  - id: tasks
    type: command
    command: qakit.tasks
  - id: gaps
    type: command
    command: qakit.gaps
  - id: write
    type: gate
    prompt: "Which test framework to use? (playwright/cypress/jest)"
  - id: coverage
    type: command
    command: qakit.coverage
  - id: ci
    type: command
    command: qakit.ci.github-actions
  - id: review
    type: command
    command: qakit.review.pr
