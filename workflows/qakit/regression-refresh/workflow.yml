id: regression-refresh
name: Regression Refresh Workflow
version: 1.0.0
description: Update regression suite from coverage analysis and gap report.
tags: [regression, maintenance]
steps:
  - id: regression
    type: command
    command: qakit.regression
  - id: maintain-flaky
    type: command
    command: qakit.maintain.flaky
  - id: maintain-data
    type: command
    command: qakit.maintain.data
  - id: ci
    type: command
    command: qakit.ci.github-actions
