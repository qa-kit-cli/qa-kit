id: playwright-e2e
name: Playwright E2E Workflow
version: 1.0.0
description: End-to-end QA workflow optimized for Playwright TypeScript projects.
tags: [playwright, e2e]
steps:
  - id: strategy
    type: command
    command: qakit.strategy
