[project]
name = "qa-kit-cli"
version = "0.3.0"
description = "QA Kit CLI — AI-assisted QA automation toolkit for Playwright, Cypress, Jest, and more."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "QA Kit Contributors" }]
keywords = ["qa", "testing", "playwright", "cypress", "automation", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.14.0",
    "click>=8.2.1",
    "rich>=14.0",
    "platformdirs>=4.0",
    "readchar>=4.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "pathspec>=0.12.0",
    "json5>=0.13.0",
    "keyring>=25.0",
]

[project.scripts]
qakit = "qa_kit_cli:main"

[project.urls]
Homepage = "https://github.com/qa-kit-cli/qa-kit"
Documentation = "https://qa-kit.dev/docs"
Repository = "https://github.com/qa-kit-cli/qa-kit"
Issues = "https://github.com/qa-kit-cli/qa-kit/issues"
Changelog = "https://github.com/qa-kit-cli/qa-kit/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_kit_cli"]

[tool.hatch.build.targets.wheel.force-include]
# Core document templates
"templates/qa-strategy-template.md"         = "qa_kit_cli/core_pack/templates/qa-strategy-template.md"
"templates/test-plan-template.md"           = "qa_kit_cli/core_pack/templates/test-plan-template.md"
"templates/test-tasks-template.md"          = "qa_kit_cli/core_pack/templates/test-tasks-template.md"
"templates/bug-report-template.md"          = "qa_kit_cli/core_pack/templates/bug-report-template.md"
"templates/test-policy-template.md"         = "qa_kit_cli/core_pack/templates/test-policy-template.md"
"templates/coverage-report-template.md"     = "qa_kit_cli/core_pack/templates/coverage-report-template.md"
"templates/qa-checklist-template.md"        = "qa_kit_cli/core_pack/templates/qa-checklist-template.md"
"templates/traceability-matrix-template.md" = "qa_kit_cli/core_pack/templates/traceability-matrix-template.md"
"templates/regression-suite-template.md"    = "qa_kit_cli/core_pack/templates/regression-suite-template.md"
"templates/defect-summary-template.md"      = "qa_kit_cli/core_pack/templates/defect-summary-template.md"
"templates/release-gate-template.md"        = "qa_kit_cli/core_pack/templates/release-gate-template.md"
"templates/test-environments-template.md"   = "qa_kit_cli/core_pack/templates/test-environments-template.md"
# Slash command templates (all files in templates/commands/ are bundled)
"templates/commands"                       = "qa_kit_cli/core_pack/commands"
# Platform scripts
"scripts/bash"                             = "qa_kit_cli/core_pack/scripts/bash"
"scripts/powershell"                       = "qa_kit_cli/core_pack/scripts/powershell"
# Bundled extensions
"extensions/git"                           = "qa_kit_cli/core_pack/extensions/git"
"extensions/coverage-gate"                 = "qa_kit_cli/core_pack/extensions/coverage-gate"
"extensions/test-numbering"               = "qa_kit_cli/core_pack/extensions/test-numbering"
"extensions/allure"                        = "qa_kit_cli/core_pack/extensions/allure"
"extensions/testrail"                      = "qa_kit_cli/core_pack/extensions/testrail"
"extensions/jira"                          = "qa_kit_cli/core_pack/extensions/jira"
"extensions/catalog.json"                  = "qa_kit_cli/core_pack/extensions/catalog.json"
"extensions/catalog.community.json"        = "qa_kit_cli/core_pack/extensions/catalog.community.json"
# Bundled presets
"presets/playwright"                       = "qa_kit_cli/core_pack/presets/playwright"
"presets/cypress"                          = "qa_kit_cli/core_pack/presets/cypress"
"presets/lean-qa"                          = "qa_kit_cli/core_pack/presets/lean-qa"
"presets/catalog.json"                     = "qa_kit_cli/core_pack/presets/catalog.json"
"presets/catalog.community.json"           = "qa_kit_cli/core_pack/presets/catalog.community.json"
# Integration catalogs
"integrations/catalog.json"                = "qa_kit_cli/core_pack/integrations/catalog.json"
"integrations/catalog.community.json"      = "qa_kit_cli/core_pack/integrations/catalog.community.json"
# Bundled workflows (parent entry covers all subdirectories recursively)
"workflows/qakit"                          = "qa_kit_cli/core_pack/workflows/qakit"
"workflows/catalog.json"                   = "qa_kit_cli/core_pack/workflows/catalog.json"
"workflows/catalog.community.json"         = "qa_kit_cli/core_pack/workflows/catalog.community.json"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.11",
    "types-PyYAML",
    "types-setuptools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
